  <text x="60" y="909" class="note">The subject reads, but its construction is reduced to a sign.</text>
  <text x="526" y="909" class="note">Supports, joints, openings and overlaps describe the object.</text>
  <text x="992" y="909" class="note">Light and material reinforce a shape that already works.</text>
