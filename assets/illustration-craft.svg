  <text x="60" y="519" class="note">A useful icon; too little information for a large feature scene.</text>
  <text x="526" y="519" class="note">Real regions, controls, content and a clear hierarchy.</text>
  <text x="992" y="519" class="note">The same structure, with selective detail and depth.</text>

